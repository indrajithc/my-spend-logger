<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My Spend Logger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      padding: 1rem;
      background: #f5f5f5;
    }
    .category-icon {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4 text-center">💸 My Spend Logger</h2>

    <div class="d-flex justify-content-between mb-2">
      <button id="authorize_button" class="btn btn-primary">Authorize</button>
      <button id="signout_button" class="btn btn-danger" style="display:none;">Sign Out</button>
    </div>

    <form id="expenseForm" class="card p-3">
      <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" id="date" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="category" class="form-label">Category</label>
        <div class="d-flex gap-2">
          <select id="category" class="form-select flex-grow-1">
            <option>Food</option>
            <option>Transport</option>
            <option>Entertainment</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Other</option>
          </select>
          <input type="text" id="newCategory" class="form-control" placeholder="New Category" />
          <button type="button" id="addCategory" class="btn btn-secondary">+</button>
        </div>
        <div id="categoryError" class="text-danger small mt-1"></div>
      </div>
      <div class="mb-3">
        <label for="amount" class="form-label">Amount (Rs)</label>
        <input type="number" id="amount" class="form-control" />
      </div>
      <button type="submit" class="btn btn-success w-100">Add Expense</button>
    </form>

    <div id="status" class="alert mt-3 d-none"></div>
  </div>

  <!-- Google API -->
  <script src="https://apis.google.com/js/api.js" async defer onload="gapiLoaded()"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>

  <script>
    // Replace with your credentials 
    const CLIENT_ID = '531735313700-ohs976audr2cl3mttilf2f10580480e0.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyCkJPL55u9pzOaYmGn-ic5QjqKgBe8o-RA';
    const SPREADSHEET_ID = '1vU6VaHiKkgCwLb3h8ydLjPVZDoGaeQOxBBOygETFrdQ';
    const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    const authorizeButton = document.getElementById('authorize_button');
    const signoutButton = document.getElementById('signout_button');
    const statusEl = document.getElementById('status');
    const categorySelect = document.getElementById('category');
    const newCategoryInput = document.getElementById('newCategory');
    const addCategoryButton = document.getElementById('addCategory');
    const categoryError = document.getElementById('categoryError');

    function gapiLoaded() {
      gapi.load('client', initializeGapiClient);
    }

    async function initializeGapiClient() {
      await gapi.client.init({
        apiKey: API_KEY,
        discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'],
      });
      gapiInited = true;
      maybeEnableButtons();
    }

    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: '',
      });
      gisInited = true;
      maybeEnableButtons();
    }

    function maybeEnableButtons() {
      if (gapiInited && gisInited) {
        authorizeButton.style.display = 'inline-block';
      }
    }

    authorizeButton.onclick = () => {
      tokenClient.callback = async (resp) => {
        if (resp.error) {
          console.error(resp);
          return;
        }
        authorizeButton.textContent = 'Refresh';
        signoutButton.style.display = 'inline-block';
        statusEl.className = 'alert alert-success';
        statusEl.textContent = 'Signed in!';
        statusEl.classList.remove('d-none');
      };

      if (gapi.client.getToken() === null) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        tokenClient.requestAccessToken({ prompt: '' });
      }
    };

    signoutButton.onclick = () => {
      const token = gapi.client.getToken();
      if (token) {
        google.accounts.oauth2.revoke(token.access_token);
        gapi.client.setToken('');
        statusEl.textContent = 'Signed out';
        signoutButton.style.display = 'none';
        authorizeButton.textContent = 'Authorize';
      }
    };

    addCategoryButton.addEventListener('click', () => {
      const newCategory = newCategoryInput.value.trim();
      categoryError.textContent = '';

      if (!newCategory) {
        categoryError.textContent = 'Enter a category name.';
        return;
      }

      const exists = Array.from(categorySelect.options).some(opt => opt.text.toLowerCase() === newCategory.toLowerCase());

      if (exists) {
        categoryError.textContent = 'Category already exists.';
        return;
      }

      const newOption = document.createElement('option');
      newOption.text = newCategory;
      newOption.value = newCategory;
      categorySelect.appendChild(newOption);
      categorySelect.value = newCategory;
      newCategoryInput.value = '';
    });

    document.getElementById('expenseForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const date = document.getElementById('date').value || new Date().toISOString().slice(0, 10);
      const category = document.getElementById('category').value;
      const amount = document.getElementById('amount').value;

      if (!amount || isNaN(amount)) {
        alert('Please enter a valid amount.');
        return;
      }

      try {
        const response = await gapi.client.sheets.spreadsheets.values.append({
          spreadsheetId: SPREADSHEET_ID,
          range: 'Sheet1!A:C',
          valueInputOption: 'USER_ENTERED',
          insertDataOption: 'INSERT_ROWS',
          resource: {
            values: [[date, category, parseFloat(amount)]],
          },
        });

        statusEl.textContent = 'Expense added successfully!';
        statusEl.className = 'alert alert-success';
        statusEl.classList.remove('d-none');

        document.getElementById('expenseForm').reset();
        document.getElementById('date').value = date;
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Failed to save entry.';
        statusEl.className = 'alert alert-danger';
        statusEl.classList.remove('d-none');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('date').value = today;
    });
  </script>
</body>
</html>
